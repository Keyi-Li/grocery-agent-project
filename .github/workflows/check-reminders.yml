name: Check reminders

# Reminders are intentionally decoupled from user requests (see
# grocery_agent/api.py's check_reminders endpoint and _finalize) — a
# household with no activity should still get notified about
# expiring/stale items. This is what actually triggers the check,
# independent of anyone talking to the bot.
#
# Runs hourly rather than at one fixed daily time because households
# can each be in a different timezone (Household.timezone) — the
# endpoint itself only actually sends a digest to a household when
# it's currently their configured local hour (see
# reminders.REMINDER_DIGEST_HOUR), so one shared hourly trigger still
# lands once a day per household, regardless of timezone.

on:
  schedule:
    - cron: "0 * * * *"  # every hour, on the hour
  workflow_dispatch: {}  # allow a manual run from the Actions tab too

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the scheduled reminder check
        run: |
          curl -sf -X POST "${{ vars.APP_BASE_URL || 'https://grocery-agent-koi.fly.dev' }}/internal/check_reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
